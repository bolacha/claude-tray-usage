name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build — ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (arm64)
          - os: ubuntu-latest
            name: Linux
          - os: windows-latest
            name: Windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgl1-mesa-dev xorg-dev

      - name: go vet
        if: runner.os != 'Windows'
        run: go vet ./...

      - name: Build
        if: runner.os != 'Windows'
        env:
          CGO_ENABLED: "1"
        run: go build -o /dev/null .

      - name: Build (Windows)
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: "1"
        run: go build -ldflags="-H windowsgui" -o NUL .
