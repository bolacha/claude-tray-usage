name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── macOS Apple Silicon (arm64) ──────────────────────────────────────────
  build-macos:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build
        env:
          GOARCH: arm64
          CGO_ENABLED: "1"
        run: go build -ldflags="-s -w" -o claude-tray .

      - name: Package
        run: |
          mkdir -p dist
          zip dist/claude-tray-macos-arm64.zip claude-tray

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/claude-tray-macos-arm64.zip

  # ── Linux x86_64 ────────────────────────────────────────────────────────
  build-linux-amd64:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgl1-mesa-dev xorg-dev

      - name: Build
        env:
          CGO_ENABLED: "1"
        run: go build -ldflags="-s -w" -o claude-tray .

      - name: Package
        run: |
          mkdir -p dist
          tar czf dist/claude-tray-linux-amd64.tar.gz claude-tray

      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: dist/claude-tray-linux-amd64.tar.gz

  # ── Linux arm64 ─────────────────────────────────────────────────────────
  build-linux-arm64:
    name: Linux (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgl1-mesa-dev xorg-dev

      - name: Build
        env:
          CGO_ENABLED: "1"
        run: go build -ldflags="-s -w" -o claude-tray .

      - name: Package
        run: |
          mkdir -p dist
          tar czf dist/claude-tray-linux-arm64.tar.gz claude-tray

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: dist/claude-tray-linux-arm64.tar.gz

  # ── Windows x86_64 ──────────────────────────────────────────────────────
  build-windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build
        env:
          CGO_ENABLED: "1"
        run: go build -ldflags="-s -w -H windowsgui" -o claude-tray.exe .

      - name: Package
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path claude-tray.exe -DestinationPath dist/claude-tray-windows-amd64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/claude-tray-windows-amd64.zip

  # ── Create GitHub Release ────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [build-macos, build-linux-amd64, build-linux-arm64, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create checksums
        run: |
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) | sort | xargs sha256sum > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/macos/claude-tray-macos-arm64.zip
            artifacts/linux-amd64/claude-tray-linux-amd64.tar.gz
            artifacts/linux-arm64/claude-tray-linux-arm64.tar.gz
            artifacts/windows/claude-tray-windows-amd64.zip
            checksums.txt
          body: |
            ## Installation

            | Platform | Download |
            |----------|----------|
            | macOS (Apple Silicon — M1/M2/M3/M4) | `claude-tray-macos-arm64.zip` |
            | Linux x86_64 | `claude-tray-linux-amd64.tar.gz` |
            | Linux arm64 | `claude-tray-linux-arm64.tar.gz` |
            | Windows x86_64 | `claude-tray-windows-amd64.zip` |

            ### macOS — first launch
            macOS will block an unsigned binary. Run once to allow it:
            ```bash
            unzip claude-tray-macos-arm64.zip
            xattr -cr claude-tray && ./claude-tray
            ```

            ### Linux
            ```bash
            tar xzf claude-tray-linux-amd64.tar.gz && ./claude-tray
            ```

            ### Windows
            Extract `claude-tray-windows-amd64.zip` and double-click `claude-tray.exe`.

            ---
            Verify downloads with `checksums.txt` (SHA-256).
